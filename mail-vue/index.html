<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FAFAFB" id="theme-color-meta">
  <meta name="description" content="Unicorn Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Unicorn Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>Unicorn Mail</title>
  <link rel="icon" href="/public/mail.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    /* 防闪白：在 CSS 之前同步写好主题（§9.1）。
       颜色常量与 src/composables/useTheme.js 的 THEME_COLOR 保持一致，改一处要改两处。 */
    (function () {
      var root = document.documentElement;
      var mode = localStorage.getItem('um-theme');
      if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
        // 迁移旧的 pinia 持久化值
        try {
          var legacy = JSON.parse(localStorage.getItem('ui') || 'null');
          mode = legacy && typeof legacy.dark === 'boolean' ? (legacy.dark ? 'dark' : 'light') : 'system';
        } catch (e) {
          mode = 'system';
        }
      }
      var dark = mode === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : mode === 'dark';

      root.classList.toggle('dark', dark);
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themeMode = mode;

      var isMobile = !window.matchMedia('(pointer: fine) and (hover: hover)').matches;
      document.getElementById('theme-color-meta')
          .setAttribute('content', dark ? (isMobile ? '#0A0A0B' : '#101012') : (isMobile ? '#FFFFFF' : '#FAFAFB'));
    })();
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #0A0A0B;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--um-bg-canvas, #FFFFFF);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(110, 86, 207, 0.16);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #6E56CF;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(110, 86, 207, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/mail-pwa.png" alt="Unicorn Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
